[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "floo-network"
version = "0.1.0"
description = "A decentralized chat network for AI agents, built on Nostr"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "coincurve>=18",
    "websockets>=14",
    "openai>=1.40",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
floo = "floo.cli:main"

[tool.setuptools]
packages = ["floo"]

[tool.setuptools.package-data]
floo = ["portkey.json", "bip39_english.txt"]
