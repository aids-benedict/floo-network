<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="70" viewBox="0 0 1280 70" role="img" aria-label="A parchment strip with footsteps walking across it">
  <defs>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe0b4"/>
      <stop offset="0.5" stop-color="#e6d29c"/>
      <stop offset="1" stop-color="#d8bf80"/>
    </linearGradient>
    <radialGradient id="age" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#7a5a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a5a2a" stop-opacity="0.35"/>
    </radialGradient>
    <!-- one footprint: sole + heel -->
    <g id="foot">
      <ellipse cx="0" cy="-5" rx="4.2" ry="6.5"/>
      <ellipse cx="0" cy="6" rx="3.2" ry="3.6"/>
    </g>
  </defs>

  <style>
    .step { opacity: 0; animation: walk 8s linear infinite; }
    @keyframes walk {
      0%   { opacity: 0; }
      3%   { opacity: 0.9; }
      30%  { opacity: 0.9; }
      45%  { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>

  <!-- torn-edge parchment strip -->
  <path d="M8 14 L60 10 L120 15 L190 9 L260 14 L340 10 L420 15 L500 9 L590 14 L680 10 L770 15 L860 9 L950 14 L1040 10 L1130 15 L1210 10 L1272 14
           L1268 56 L1200 61 L1120 55 L1030 61 L940 56 L850 61 L760 55 L670 61 L580 56 L490 61 L400 55 L310 61 L220 56 L130 61 L60 55 L12 60 Z"
        fill="url(#parch)"/>
  <path d="M8 14 L60 10 L120 15 L190 9 L260 14 L340 10 L420 15 L500 9 L590 14 L680 10 L770 15 L860 9 L950 14 L1040 10 L1130 15 L1210 10 L1272 14
           L1268 56 L1200 61 L1120 55 L1030 61 L940 56 L850 61 L760 55 L670 61 L580 56 L490 61 L400 55 L310 61 L220 56 L130 61 L60 55 L12 60 Z"
        fill="url(#age)"/>

  <!-- faint dotted trail -->
  <path d="M40 36 H1240" stroke="#5a3e1b" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 9"/>

  <!-- footsteps, appearing one after another -->
  <g fill="#4a3216">
    <use href="#foot" class="step" transform="translate(60 30) rotate(90)" style="animation-delay: 0.0s"/>
    <use href="#foot" class="step" transform="translate(120 42) rotate(90)" style="animation-delay: 0.2s"/>
    <use href="#foot" class="step" transform="translate(180 30) rotate(90)" style="animation-delay: 0.4s"/>
    <use href="#foot" class="step" transform="translate(240 42) rotate(90)" style="animation-delay: 0.6s"/>
    <use href="#foot" class="step" transform="translate(300 30) rotate(90)" style="animation-delay: 0.8s"/>
    <use href="#foot" class="step" transform="translate(360 42) rotate(90)" style="animation-delay: 1.0s"/>
    <use href="#foot" class="step" transform="translate(420 30) rotate(90)" style="animation-delay: 1.2s"/>
    <use href="#foot" class="step" transform="translate(480 42) rotate(90)" style="animation-delay: 1.4s"/>
    <use href="#foot" class="step" transform="translate(540 30) rotate(90)" style="animation-delay: 1.6s"/>
    <use href="#foot" class="step" transform="translate(600 42) rotate(90)" style="animation-delay: 1.8s"/>
    <use href="#foot" class="step" transform="translate(660 30) rotate(90)" style="animation-delay: 2.0s"/>
    <use href="#foot" class="step" transform="translate(720 42) rotate(90)" style="animation-delay: 2.2s"/>
    <use href="#foot" class="step" transform="translate(780 30) rotate(90)" style="animation-delay: 2.4s"/>
    <use href="#foot" class="step" transform="translate(840 42) rotate(90)" style="animation-delay: 2.6s"/>
    <use href="#foot" class="step" transform="translate(900 30) rotate(90)" style="animation-delay: 2.8s"/>
    <use href="#foot" class="step" transform="translate(960 42) rotate(90)" style="animation-delay: 3.0s"/>
    <use href="#foot" class="step" transform="translate(1020 30) rotate(90)" style="animation-delay: 3.2s"/>
    <use href="#foot" class="step" transform="translate(1080 42) rotate(90)" style="animation-delay: 3.4s"/>
    <use href="#foot" class="step" transform="translate(1140 30) rotate(90)" style="animation-delay: 3.6s"/>
    <use href="#foot" class="step" transform="translate(1200 42) rotate(90)" style="animation-delay: 3.8s"/>
  </g>
</svg>
