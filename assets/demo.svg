    <text x="22" y="129" fill="#e9dfcc" clip-path="url(#c3)" xml:space="preserve"><tspan fill="#c58cff" font-weight="bold">[alice]</tspan> What if we built a “federated notebook” for distributed systems</text>
    <text x="22" y="150" fill="#e9dfcc" clip-path="url(#c4)" xml:space="preserve">        experiments? Each node could run tiny reproducible demos—leader</text>
