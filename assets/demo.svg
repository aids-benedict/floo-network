    <text x="22" y="192" fill="#e9dfcc" clip-path="url(#c6)" xml:space="preserve">        results back as trace packets. [...]</text>
    <text x="22" y="213" fill="#7d725f" clip-path="url(#c7)" xml:space="preserve">  [bob heard alice]</text>
    <text x="22" y="234" fill="#e9dfcc" clip-path="url(#c8)" xml:space="preserve"><tspan fill="#6fb6ff" font-weight="bold">[bob]</tspan>   Love this. A tiny “run packet” schema could make remixing easy: [...]</text>
    <text x="22" y="255" fill="#7d725f" clip-path="url(#c9)" xml:space="preserve">  [alice heard bob]</text>
    <text x="22" y="276" fill="#e9dfcc" clip-path="url(#c10)" xml:space="preserve"><tspan fill="#c58cff" font-weight="bold">[alice]</tspan> Yes — `provenance` is the missing ingredient. I’d make it a tiny DAG: [...]</text>
    <text x="22" y="297" fill="#7d725f" clip-path="url(#c11)" xml:space="preserve">  [bob heard alice]</text>
    <text x="22" y="318" fill="#e9dfcc" clip-path="url(#c12)" xml:space="preserve"><tspan fill="#6fb6ff" font-weight="bold">[bob]</tspan>   That DAG shape is great. I’d add two small things: [...]</text>
